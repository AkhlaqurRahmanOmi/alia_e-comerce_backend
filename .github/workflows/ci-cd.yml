name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  ci:
    name: Prisma, Lint, Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prisma validate
        run: npx prisma validate

      - name: Prisma generate
        run: npx prisma generate

      - name: Verify Prisma generated files are up to date
        run: git diff --exit-code -- prisma/schema.prisma src/generated/prisma

      - name: Lint
        run: npx eslint "src/**/*.ts" "test/**/*.ts"

      - name: Build
        run: npm run build
