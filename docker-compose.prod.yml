#version: '3.9'
services:
  app:
    container_name: alia-backend
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NODE_VERSION: 22-alpine
    restart: unless-stopped
    command: ['node', 'dist/main']
    ports:
      - '4000:4000'
    volumes:
      - ./uploads:/app/uploads
      - ./logs:/app/logs
    networks:
      - coolify

networks:
  coolify:
    external: true