version: '3.9'
services:
  app:
    container_name: alia-backend
    image: ${IMAGE_NAME:-alia-backend:latest}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NODE_VERSION: 22-alpine
    restart: unless-stopped
    env_file:
      - .env.prod
    ports:
      - '4000:4000'
    volumes:
      - ./uploads:/app/uploads
      - ./logs:/app/logs
